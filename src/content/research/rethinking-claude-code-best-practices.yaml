title: "Rethinking Claude Code Best Practices"
summary: >-
  A timely update, as of November 2026, on how to get the best out of Claude.
  Lydia Hallie of Anthropic shows how much the way we work with Claude has
  changed in just six months, enough that it is substantially reshaping the
  software development lifecycle. Teams still using last year's habits are
  likely overspending on, and under-utilising, Claude Code.
