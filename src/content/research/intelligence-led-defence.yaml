title: "Intelligence-Led Defence: A Field Guide to Cyber Threat Intelligence"
summary: >-
  A practitioner's guide to moving from indicator feeds to real adversary
  understanding. It walks through the intelligence lifecycle in the SOC, the
  four levels of intelligence, and how the Cyber Kill Chain, MITRE ATT&CK and
  the Diamond Model work together, then profiles the TTPs of groups from FIN7
  and Scattered Spider to APT29 and Volt Typhoon, closing with a 90-day
  maturity roadmap.
